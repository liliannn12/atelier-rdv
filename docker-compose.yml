services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atelier
    ports:
      - 5432:5432
    volumes:
      - atelier-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atelier-pg: